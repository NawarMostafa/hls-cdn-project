name: Deploy Docker Compose to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04 # Pinned explicitly to avoid automatic OS shifts

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Copy Project Files to EC2 via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/hls-cdn-project"

      - name: Restart Docker Compose on EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/hls-cdn-project
            sudo docker compose down
            sudo docker compose up --build -d
