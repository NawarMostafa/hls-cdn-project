services:
  origin-server:
    build: ./origin
    container_name: origin-server
    volumes:
    - ./origin/html/:/usr/share/nginx/html
    networks:
      - cdn-net

  edge-node-1:
    build: ./edge
    container_name: edge-node-1
    ports:
      - "8081:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - origin-server
    networks:
      - cdn-net

  edge-node-2:
    build: ./edge
    container_name: edge-node-2
    ports:
      - "8082:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - origin-server
    networks:
      - cdn-net

networks:
  cdn-net:
    driver: bridge