events {
    worker_connections 1024;
}

http {
    # Define a shared memory zone for caching (10 megabytes, up to 1GB max disk space)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=hls_cache:10m max_size=1g inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name edge-node-1.local;

        location / {
            # Point to our cache zone
            proxy_cache hls_cache;

            # Custom Cache Key: Includes scheme, request method, host, and request URI
            proxy_cache_key "$scheme$request_method$host$uri";

            # Cache TTLs: Cache HTTP 200 responses for 30 minutes
            proxy_cache_valid 200 30m;

            # Pass requests back to our Origin container
            proxy_pass http://origin-server:80;

            # Add an X-Cache diagnostic header so clients know if it was a HIT or MISS
            add_header X-Cache $upstream_cache_status;
        }
    }
}